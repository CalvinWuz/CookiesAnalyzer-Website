version: '3.9'

services:
  backend:
    build: ./backend
    container_name: cookierisk-backend
    environment:
      - BACKEND_PORT=3001
      - NODE_ENV=production
    ports:
      - "3001:3001"
    volumes:
      - ./backend/tracker-radar:/app/tracker-radar:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: cookierisk-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
